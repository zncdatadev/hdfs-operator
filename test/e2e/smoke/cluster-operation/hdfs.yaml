apiVersion: hdfs.kubedoop.dev/v1alpha1
kind: HdfsCluster
metadata:
  name: hdfscluster-sample
  namespace: ($namespace)
spec:
  image:
    productVersion: ($values.product_version)
  clusterOperation:
    reconciliationPaused: ($cluster_paused)
    stopped: ($cluster_stopped)
  clusterConfig:
    zookeeperConfigMapName: sample-hdfs-znode
  nameNodes:
    roleGroups:
      default:
        replicas: 2
  journalNodes:
    roleGroups:
      default:
        replicas: 1
  dataNodes:
    roleGroups:
      default:
        replicas: 1
